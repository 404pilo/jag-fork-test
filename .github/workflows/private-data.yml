name: private-data

# This workflow runs the file of main, not the file of the pull request.
# It holds a secret. No step may run, source, or read as config a file of
# the folder "pr" (spec decision 15). Do not add a "ref:" to the first
# checkout, and do not rename the job: the ruleset of main names it.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  private-data:
    name: private-data
    runs-on: ubuntu-latest
    steps:
      # The code of main (on push: the pushed commit). check.sh comes from here only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          persist-credentials: false

      # The merge of the pull request and main. This folder is data only.
      - if: github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: pr
          fetch-depth: 0
          persist-credentials: false
          # Needed for a pull request from a fork. Safe, because no step runs a file of "pr".
          allow-unsafe-pr-checkout: true

      - name: Download gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Check for private data
        env:
          PRIVATE_PATTERNS: ${{ secrets.PRIVATE_PATTERNS }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITLEAKS: ${{ runner.temp }}/gitleaks/gitleaks
          REPO_DIR: ${{ github.event_name == 'pull_request_target' && 'pr' || 'base' }}
          FORK_PR: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.id != github.repository_id }}
        run: base/scripts/private-data/check.sh
