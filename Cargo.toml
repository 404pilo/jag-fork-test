[package]
name = "jag-grep"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Grep with a model that ranks the matches by how well they answer your question"
repository = "https://github.com/ai-ready-future/jag"

[lib]
name = "jag"
path = "src/lib.rs"

[[bin]]
name = "jag"
path = "src/main.rs"

[lints.clippy]
all = "warn"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
rpassword = "7.5.4"
rustix = { version = "1.1.5", features = ["event"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1"
signal-hook = "0.4.5"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
