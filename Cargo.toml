[package]
name = "jag-grep"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Grep with a model that ranks the matches by how well they answer your question"
repository = "https://github.com/ai-ready-future/jag"

[lib]
name = "jag"
path = "src/lib.rs"

[[bin]]
name = "jag"
path = "src/main.rs"

[lints.clippy]
all = "warn"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
signal-hook = "0.4.5"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
